# Register the omarchy internal-mic helper. The Lua script in scripts/ clears
# the persistent mute on the laptop's internal microphone whenever no headset
# microphone is plugged in, so applications always find a usable input source
# after a headset unplug.

wireplumber.components = [
  {
    name = "omarchy-internal-mic-default",
    type = "script/lua",
    provides = [ "hooks.omarchy.internal-mic" ]
    requires = [ "support.lua-scripting" ]
    after = [ "policy.device.routes" ]
  }
]
