---
- name: Ensure the server role runs on supported hosts
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family in server_docker_packages_by_family
    fail_msg: >-
      server currently supports only these OS families:
      {{ server_docker_packages_by_family.keys() | join(', ') }}.

- name: Load server docker package plan for this OS family
  ansible.builtin.set_fact:
    server_docker_packages: "{{ server_docker_packages_by_family[ansible_facts.os_family].docker }}"

# Docker stays in the server role because it is a server platform concern, not a
# universal baseline like the common CLI packages in roles/base.
- name: Install Docker from distro packages
  ansible.builtin.package:
    name: "{{ server_docker_packages }}"
    state: present

# Docker defaults to an *unbounded* json-file log per container. With 18
# containers and no cap, serverannah had accumulated 946 MB of logs (frigate
# alone at 650 MB) on a root filesystem with ~53 GB free, and nothing would ever
# reclaim it. A single container in a crash-restart loop can fill the disk
# overnight, which takes Postgres, MariaDB, Caddy and the Borg dump step down
# together. Cap it globally rather than per-container so a service added later
# inherits the limit instead of having to remember it.
- name: Configure the Docker daemon
  ansible.builtin.copy:
    content: "{{ server_docker_daemon_config | to_nice_json }}\n"
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  register: server_docker_daemon_config_file
  notify: Restart docker

- name: Ensure Docker service is enabled and running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

# Let the main operator user access Docker without sudo so tools like
# lazydocker work in normal interactive shells.
- name: Ensure server Docker users are in the docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ server_docker_users }}"
