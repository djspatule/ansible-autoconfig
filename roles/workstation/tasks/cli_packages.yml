---
- name: Gather minimal facts for workstation CLI packages
  ansible.builtin.setup:
    gather_subset:
      - min

- name: Require a supported OS family for workstation CLI packages
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family in workstation_cli_packages_by_family
    fail_msg: >-
      Workstation CLI packages are not defined for {{ ansible_facts.os_family }}.
      Add this OS family to workstation_cli_packages_by_family.

- name: Detect Omarchy before workstation package installs
  ansible.builtin.stat:
    path: /usr/bin/omarchy
  register: workstation_omarchy_binary
  when: ansible_facts.os_family == "Archlinux"

- name: Require explicit acknowledgement for workstation package installs on Omarchy
  ansible.builtin.assert:
    that:
      - omarchy_allow_ansible_package_installs | bool
    fail_msg: >-
      This host looks like Omarchy. Prefer `omarchy pkg add` and `omarchy update`
      for app-level changes. Set omarchy_allow_ansible_package_installs: true only
      for baseline packages that Ansible should manage intentionally.
  when:
    - ansible_facts.os_family == "Archlinux"
    - workstation_omarchy_binary.stat.exists | default(false)

- name: Install workstation CLI/TUI packages
  ansible.builtin.package:
    name: "{{ workstation_cli_packages_by_family[ansible_facts.os_family] }}"
    state: present
  when: workstation_cli_packages_by_family[ansible_facts.os_family] | length > 0
