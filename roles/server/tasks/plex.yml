---
- name: Ensure Plex secret directory exists
  ansible.builtin.file:
    path: "{{ plex_secret_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

# Plex writes its config under /config and reads the media tree from /data.
# Letting the container manage /config keeps permissions consistent with PUID.
# /mnt/SSD_1TO is mounted read-only because Plex should never mutate the media
# files themselves.
- name: Ensure Plex config directory exists
  ansible.builtin.file:
    path: "{{ plex_config_dir }}"
    state: directory
    owner: "{{ plex_puid }}"
    group: "{{ plex_pgid }}"
    mode: "0755"

- name: Check whether the Plex media root is mounted
  ansible.builtin.command:
    argv:
      - findmnt
      - --mountpoint
      - "{{ plex_media_root }}"
  register: plex_media_mount_check
  changed_when: false
  failed_when: false

- name: Skip Plex when the configured media root is not mounted
  ansible.builtin.debug:
    msg: >-
      Plex is enabled, but {{ plex_media_root }} is not an active mount.
      Skipping Plex so the container does not start with an empty media tree
      that would silently look complete.
  when: plex_media_mount_check.rc != 0

- name: Configure and run Plex when the media root is mounted
  when: plex_media_mount_check.rc == 0
  block:
    - name: Check whether the Plex claim token file exists
      ansible.builtin.stat:
        path: "{{ plex_claim_token_file }}"
      register: plex_claim_token_file_stat
      no_log: true

    - name: Read the Plex claim token
      ansible.builtin.slurp:
        src: "{{ plex_claim_token_file }}"
      register: plex_claim_token_slurp
      no_log: true
      when: plex_claim_token_file_stat.stat.exists

    - name: Resolve the Plex claim token value
      ansible.builtin.set_fact:
        plex_claim_token_value: "{{ plex_claim_token_slurp.content | b64decode | trim }}"
      when: plex_claim_token_file_stat.stat.exists
      no_log: true

    - name: Default the Plex claim token to empty
      ansible.builtin.set_fact:
        plex_claim_token_value: ""
      when: not plex_claim_token_file_stat.stat.exists

    - name: Ensure Plex container network exists
      community.docker.docker_network:
        name: "{{ plex_network_name }}"
        state: present

    - name: Pull Plex image
      community.docker.docker_image:
        name: "{{ plex_image }}"
        source: pull
        force_source: true
      register: plex_image_pull

    # Bridge mode rather than host networking: host networking would put Plex
    # outside the autoconfig-services docker network and break any future
    # inter-container routing. Bridge mode with the LAN-bound published port
    # above gives the family web + app access without any public exposure.
    - name: Run Plex container
      community.docker.docker_container:
        name: "{{ plex_container_name }}"
        image: "{{ plex_image }}"
        state: started
        recreate: "{{ plex_image_pull.changed or plex_claim_token_file_stat.stat.exists }}"
        restart_policy: unless-stopped
        published_ports: "{{ plex_published_ports }}"
        networks:
          - name: "{{ plex_network_name }}"
        env:
          PUID: "{{ plex_puid | string }}"
          PGID: "{{ plex_pgid | string }}"
          TZ: "{{ plex_timezone }}"
          VERSION: docker
          PLEX_CLAIM: "{{ plex_claim_token_value }}"
        volumes:
          - "{{ plex_config_dir }}:/config"
          - "{{ plex_media_root }}:/data:ro"
      no_log: true

# --- Library seeding ---------------------------------------------------
# Wait for the first start to finish, then add the libraries declared in
# plex_libraries via Plex's HTTP API. Idempotent: re-runs skip libraries
# that already exist on the server. Plex writes the claim token into
# Preferences.xml inside the config dir; once that file exists AND the
# token is non-empty, the server is claimable and the API will accept it.
- name: Wait for the Plex claim token to appear in Preferences.xml
  ansible.builtin.shell:
    cmd: |
      set -eu
      prefs="{{ plex_config_dir }}/Library/Application Support/Plex Media Server/Preferences.xml"
      for i in $(seq 1 60); do
        if [ -s "$prefs" ] && grep -q 'PlexOnlineToken="[^"]' "$prefs" 2>/dev/null; then
          echo READY
          exit 0
        fi
        sleep 2
      done
      echo TIMEOUT
      exit 1
  args:
    executable: /bin/bash
  register: plex_claim_wait
  changed_when: false
  until: plex_claim_wait.rc == 0 and plex_claim_wait.stdout | trim == 'READY'
  retries: 1

- name: Read the Plex claim token from Preferences.xml
  ansible.builtin.shell:
    cmd: |
      set -eu
      prefs="{{ plex_config_dir }}/Library/Application Support/Plex Media Server/Preferences.xml"
      grep -oE 'PlexOnlineToken="[^"]+"' "$prefs" | head -1 | sed -E 's/^PlexOnlineToken="([^"]+)"$/\1/'
  args:
    executable: /bin/bash
  register: plex_online_token_read
  changed_when: false
  no_log: true

- name: Wait for the Plex HTTP API to start serving requests
  ansible.builtin.uri:
    url: "{{ plex_lan_ip | default('192.168.1.100') }}:32400/library/sections"
    headers:
      X-Plex-Token: "{{ plex_online_token_read.stdout }}"
    status_code: 200
    validate_certs: false
    timeout: 10
  register: plex_api_health
  until: plex_api_health.status | default(0) == 200
  retries: 30
  delay: 5
  changed_when: false
  when: plex_online_token_read.stdout | length > 0

- name: Seed Plex libraries via the HTTP API
  ansible.builtin.shell:
    cmd: |
      set -eu
      token='{{ plex_online_token_read.stdout }}'
      name='{{ item.name }}'
      type='{{ item.type }}'
      path='{{ item.path }}'
      language='{{ item.language | default("fr") }}'
      # Plex's POST /library/sections only accepts movie/show/artist/photo
      # directly. Comic and audiobook libraries are a different flow (a
      # comic book section is created as a photo sub-type on older versions,
      # or via the /hubs/comics endpoint) — skip those for now and tell the
      # operator to add them manually in Plex Web.
      case "$type" in
        movie)  num=1;  agent=com.plexapp.agents.imdb;   scanner='Plex Movie Scanner' ;;
        show)   num=2;  agent=com.plexapp.agents.thetvdb;scanner='Plex Series Scanner' ;;
        artist) num=8;  agent=com.plexapp.agents.lastfm; scanner='Plex Music Scanner' ;;
        photo)  num=13; agent=com.plexapp.agents.none;    scanner='Plex Photo Scanner' ;;
        *) echo "skip: $type not supported via this API; add manually" >&2; exit 0 ;;
      esac
      existing=$(curl -fsS -H "X-Plex-Token: $token" "{{ plex_lan_ip | default('192.168.1.100') }}:32400/library/sections" \
                  | grep -oE 'title="[^"]+"' | head -50)
      if echo "$existing" | grep -qxF "title=\"$name\""; then
        echo "exists: $name"
        exit 0
      fi
      encpath=$(printf %s "$path" | jq -sRr @uri)
      section=$(curl -fsS -X POST \
                  -H "X-Plex-Token: $token" \
                  "{{ plex_lan_ip | default('192.168.1.100') }}:32400/library/sections?type=$num&name=$(printf %s "$name" | sed 's/ /%20/g')&agent=$agent&scanner=$(printf %s "$scanner" | sed 's/ /%20/g')&language=$language&location=${encpath}")
      if echo "$section" | grep -qE '<MediaContainer[^>]*code="[0-9]+"'; then
        echo "failed to create section for $name: $section" >&2
        exit 3
      fi
      section_id=$(echo "$section" | grep -oE 'id="[0-9]+"' | head -1 | tr -dc 0-9)
      if [ -z "$section_id" ]; then
        echo "no section_id in response: $section" >&2
        exit 3
      fi
      echo "created: $name (id=$section_id, type=$type, path=$path)"
  args:
    executable: /bin/bash
  register: plex_seed_response
  changed_when: "'created:' in plex_seed_response.stdout"
  loop: "{{ plex_libraries }}"
  loop_control:
    label: "{{ item.name }} ({{ item.type }} -> {{ item.path }})"
  when:
    - plex_online_token_read.stdout | length > 0
    - plex_libraries | length > 0
