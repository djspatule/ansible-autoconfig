---
- name: Ensure Homepage root directory exists
  ansible.builtin.file:
    path: "{{ homepage_root_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure Homepage container network exists
  community.docker.docker_network:
    name: "{{ homepage_network_name }}"
    state: present

# Homepage and the reverse proxy share a named Docker network so the proxy can
# route to service names instead of host-specific bridge addresses.
- name: Deploy Homepage config tree
  ansible.builtin.copy:
    src: "{{ homepage_source_dir }}"
    dest: "{{ homepage_root_dir }}/"
    owner: root
    group: root
    mode: preserve
    directory_mode: "0755"

- name: Pull Homepage image
  community.docker.docker_image:
    name: "{{ homepage_image }}"
    source: pull
    force_source: true
  register: homepage_image_pull

- name: Run Homepage container
  community.docker.docker_container:
    name: "{{ homepage_container_name }}"
    image: "{{ homepage_image }}"
    state: started
    recreate: "{{ homepage_image_pull.changed }}"
    restart_policy: unless-stopped
    published_ports: "{{ homepage_published_ports }}"
    networks:
      - name: "{{ homepage_network_name }}"
    # The raw /var/run/docker.sock bind is deliberately gone: it was mounted
    # read-write into a public-facing dashboard, which made any RCE in Homepage
    # a full host compromise. Container status now comes from the filtered
    # read-only proxy (tasks/docker_socket_proxy.yml), reached over the shared
    # Docker network and configured in files/homepage/.../docker.yaml.
    #
    # The disk mounts are read-only and exist only so the resources widget can
    # stat them: Homepage reads usage from inside its own container, so a path
    # listed in widgets.yaml but not mounted here renders as "API Error". A
    # dashboard has no business writing to a media library or a backup
    # repository, hence :ro.
    volumes: "{{ [homepage_config_dir ~ ':/app/config'] + homepage_extra_volumes }}"
    env:
      HOMEPAGE_ALLOWED_HOSTS: "{{ (homepage_allowed_hosts + homepage_extra_allowed_hosts) | unique | join(',') }}"
