---
- name: Ensure Odoo root-managed directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ odoo_root_dir }}"

- name: Ensure Odoo secret directory exists
  ansible.builtin.file:
    path: "{{ odoo_secret_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

# The Odoo image populates /var/lib/odoo and /mnt/extra-addons at runtime, so
# the container's odoo user (UID 100, GID 101 inside the image) must own the
# bind-mount paths. Without this the entrypoint fails to create .local/share/odoo
# and Odoo returns 500 on the first request.
- name: Ensure Odoo runtime directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "100"
    group: "101"
    mode: "0755"
  loop:
    - "{{ odoo_app_dir }}"
    - "{{ odoo_addons_dir }}"

# Postgres image manages its own PGDATA permissions when the directory is
# empty; once initialised the ownership is already correct so an idempotent
# re-run is a no-op.
- name: Ensure Odoo database data directory exists
  ansible.builtin.file:
    path: "{{ odoo_db_data_dir }}"
    state: directory
    mode: "0755"

- name: Check whether the Odoo DB password file exists
  ansible.builtin.stat:
    path: "{{ odoo_db_password_file }}"
  register: odoo_db_password_file_stat
  no_log: true

- name: Generate the Odoo DB password on the target host
  ansible.builtin.shell: "tr -dc 'A-Za-z0-9' </dev/urandom | head -c 32"
  register: odoo_db_password_generated
  changed_when: true
  when: not odoo_db_password_file_stat.stat.exists
  no_log: true

- name: Save the generated Odoo DB password
  ansible.builtin.copy:
    content: "{{ odoo_db_password_generated.stdout }}\n"
    dest: "{{ odoo_db_password_file }}"
    owner: root
    group: root
    mode: "0600"
  when: not odoo_db_password_file_stat.stat.exists
  no_log: true

- name: Read the managed Odoo DB password
  ansible.builtin.slurp:
    src: "{{ odoo_db_password_file }}"
  register: odoo_db_password_slurp
  no_log: true

- name: Load the managed Odoo DB password
  ansible.builtin.set_fact:
    odoo_db_password: "{{ odoo_db_password_slurp.content | b64decode | trim }}"
  no_log: true

- name: Ensure Odoo container network exists
  community.docker.docker_network:
    name: "{{ odoo_network_name }}"
    state: present

- name: Pull Odoo database image
  community.docker.docker_image:
    name: "{{ odoo_db_image }}"
    source: pull
    force_source: true
  register: odoo_db_image_pull

# PGDATA points inside the bind-mounted volume so Postgres 16+ uses the
# version-specific path layout that lets pg_upgrade work between major releases.
- name: Run Odoo database container
  community.docker.docker_container:
    name: "{{ odoo_db_container_name }}"
    image: "{{ odoo_db_image }}"
    state: started
    recreate: "{{ odoo_db_image_pull.changed }}"
    restart_policy: unless-stopped
    networks:
      - name: "{{ odoo_network_name }}"
    volumes:
      - "{{ odoo_db_data_dir }}:/var/lib/postgresql"
    env:
      POSTGRES_DB: "{{ odoo_db_name }}"
      POSTGRES_USER: "{{ odoo_db_user }}"
      POSTGRES_PASSWORD: "{{ odoo_db_password }}"
      PGDATA: /var/lib/postgresql/data/pgdata
  no_log: true

- name: Wait for the Odoo database to become ready
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ odoo_db_container_name }}"
      - pg_isready
      - -U
      - "{{ odoo_db_user }}"
      - -d
      - "{{ odoo_db_name }}"
  register: odoo_db_ready
  changed_when: false
  retries: "{{ odoo_wait_retries }}"
  delay: "{{ odoo_wait_delay }}"
  until: odoo_db_ready.rc == 0

- name: Pull Odoo application image
  community.docker.docker_image:
    name: "{{ odoo_image }}"
    source: pull
    force_source: true
  register: odoo_image_pull

- name: Run Odoo application container
  community.docker.docker_container:
    name: "{{ odoo_container_name }}"
    image: "{{ odoo_image }}"
    state: started
    recreate: "{{ odoo_image_pull.changed }}"
    restart_policy: unless-stopped
    published_ports: "{{ odoo_published_ports }}"
    networks:
      - name: "{{ odoo_network_name }}"
    volumes:
      - "{{ odoo_app_dir }}:/var/lib/odoo"
      - "{{ odoo_addons_dir }}:/mnt/extra-addons"
    env:
      HOST: "{{ odoo_db_container_name }}"
      PORT: "5432"
      USER: "{{ odoo_db_user }}"
      PASSWORD: "{{ odoo_db_password }}"
  no_log: true

# --- One-time database seeding -----------------------------------------------
# Optional block: when server_odoo_seed_enabled is true and a zip archive is
# present at odoo_seed_archive, import it into the Odoo database. Idempotent —
# the block probes for the Odoo ir_model_data table (which exists in any
# populated Odoo database, regardless of how it was initialised) and skips the
# import when the table is present and non-empty. The archive is expected to be
# a `pg_dump` text file (dump.sql at the root) plus an Odoo filestore/
# directory tree, packed with `zip`. Place the file on the target host (scp)
# before running ansible-pull.

# First probe: does the ir_model_data table exist in the public schema?
# Done as a separate query so the second one (which would error on a missing
# table) is only issued when the table is actually there.
- name: Check whether the Odoo ir_model_data table exists
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ odoo_db_container_name }}"
      - psql
      - -U
      - "{{ odoo_db_user }}"
      - -d
      - "{{ odoo_db_name }}"
      - -tAc
      - >-
        SELECT EXISTS (SELECT 1 FROM pg_tables
                      WHERE schemaname = 'public' AND tablename = 'ir_model_data');
  register: odoo_db_ir_model_data_exists
  changed_when: false
  failed_when: false
  no_log: true

- name: Count Odoo ir_model_data rows when the table exists
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ odoo_db_container_name }}"
      - psql
      - -U
      - "{{ odoo_db_user }}"
      - -d
      - "{{ odoo_db_name }}"
      - -tAc
      - SELECT count(*) FROM ir_model_data;
  register: odoo_db_ir_model_data_rows
  changed_when: false
  failed_when: false
  no_log: true
  when: odoo_db_ir_model_data_exists.stdout | trim == 't'

# Resolve the final "is this DB populated?" flag in one place so the block's
# `when:` reads cleanly and the skip-notice below can print the same number.
- name: Resolve the Odoo database population state
  ansible.builtin.set_fact:
    odoo_db_populated: >-
      {{ (odoo_db_ir_model_data_exists.stdout | trim == 't')
         and (odoo_db_ir_model_data_rows.stdout | trim | int > 0) }}
    odoo_db_ir_model_data_count_value: >-
      {{ (odoo_db_ir_model_data_rows.stdout | trim)
         if (odoo_db_ir_model_data_exists.stdout | trim == 't') else '0' }}

- name: Seed the Odoo database from a local archive when requested
  when:
    - server_odoo_seed_enabled | default(false) | bool
    - not odoo_db_populated | default(true)
  block:
    - name: Check whether the Odoo seed archive exists
      ansible.builtin.stat:
        path: "{{ odoo_seed_archive }}"
      register: odoo_seed_archive_stat

    - name: Fail clearly when the seed archive is missing but seeding is enabled
      ansible.builtin.assert:
        that:
          - odoo_seed_archive_stat.stat.exists
        fail_msg: >-
          server_odoo_seed_enabled is true but {{ odoo_seed_archive }} is
          missing on the target host. scp the archive there first, or set
          server_odoo_seed_enabled: false in host_vars to skip this block.

    - name: Ensure the seed extraction directory exists
      ansible.builtin.file:
        path: "{{ odoo_seed_extract_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Extract the Odoo seed archive
      ansible.builtin.unarchive:
        src: "{{ odoo_seed_archive }}"
        dest: "{{ odoo_seed_extract_dir }}"
        remote_src: true
        owner: root
        group: root

    - name: Stop the Odoo application container during the import
      community.docker.docker_container:
        name: "{{ odoo_container_name }}"
        state: stopped

    - name: Drop the existing Odoo database if present
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ odoo_db_container_name }}"
          - dropdb
          - -U
          - "{{ odoo_db_user }}"
          - --if-exists
          - "{{ odoo_db_name }}"
      changed_when: false
      failed_when: false
      no_log: true

    - name: Recreate the empty Odoo database
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ odoo_db_container_name }}"
          - createdb
          - -U
          - "{{ odoo_db_user }}"
          - -O
          - "{{ odoo_db_user }}"
          - "{{ odoo_db_name }}"
      no_log: true

    # The dump is a plain pg_dump text file (uses \restrict). Stream it through
    # psql with ON_ERROR_STOP=0 so a single bad statement does not abort the
    # whole import — Odoo extensions like pg_trgm/unaccent/vector create
    # concurrently and one already-existing object would otherwise fail loudly.
    - name: Import the Odoo SQL dump into the database
      ansible.builtin.shell: |
        set -eu
        docker exec -i "{{ odoo_db_container_name }}" \
          psql -U "{{ odoo_db_user }}" -d "{{ odoo_db_name }}" -v ON_ERROR_STOP=0 \
          < "{{ odoo_seed_extract_dir }}/dump.sql"
      args:
        executable: /bin/bash

    # rsync handles the large tree quickly and is content-addressable, so
    # re-running this block is a no-op when the filestore already matches.
    # The trailing slash on the source and the explicit dest ensure we copy
    # the contents of filestore/ into /opt/odoo/app/.local/share/odoo/filestore/odoo/.
    # The Odoo container has already created /opt/odoo/app/.local/share/odoo/filestore
    # on its first startup, so the parent directory exists and is owned by the
    # Odoo user inside the container.
    - name: Copy the Odoo filestore into the application data directory
      ansible.posix.synchronize:
        src: "{{ odoo_seed_extract_dir }}/filestore/"
        dest: "{{ odoo_app_dir }}/.local/share/odoo/filestore/{{ odoo_db_name }}/"
        delete: true
        recursive: true
        rsync_opts:
          - "--chown=100:101"

    - name: Restart the Odoo application container with the seeded database
      community.docker.docker_container:
        name: "{{ odoo_container_name }}"
        state: started

    - name: Record that the Odoo seed import completed
      ansible.builtin.copy:
        content: "{{ odoo_seed_archive }} {{ odoo_seed_archive_stat.stat.mtime }}\n"
        dest: "{{ odoo_seed_marker_file }}"
        owner: root
        group: root
        mode: "0644"

# Informational when seeding is requested but the DB is already populated.
- name: Note when the Odoo seed was skipped because the database is not empty
  ansible.builtin.debug:
    msg: >-
      Odoo database {{ odoo_db_name }} already has data
      ({{ odoo_db_ir_model_data_count_value }} rows in ir_model_data),
      skipping the seed import. To re-seed, drop the database (or set
      server_odoo_seed_enabled: false) and re-run ansible-pull.
  when:
    - server_odoo_seed_enabled | default(false) | bool
    - odoo_db_populated | default(false)
